  about:
    lead: >-
      I'm a solutions engineer who has been **the technical counterpart to federal sales**, the person
      running the lab at a developer conference, and the one on site when the cameras go up.
    paragraphs:
      - >-
        For nearly three years at NEC National Security Systems I ran discovery and requirements sessions,
        tailored demos, and stayed through deployment and post-sales support for identity, access and
        perimeter-security programs with DHS, CBP, the Secret Service, the U.S. Marshals Service and U.S. Courts.
      - >-
        Before that, at Intel, I built and ran hands-on AI labs, demos and a 100-developer hackathon for
        Intel Innovation 2022. Before *that*, I was training transformer models on household energy data
        at Portland General Electric, two years before ChatGPT made the architecture famous.
      - >-
        Today I build AI-assisted web applications as a freelance forward deployed engineer, and I'm looking
        for my next solutions or sales engineering role.
