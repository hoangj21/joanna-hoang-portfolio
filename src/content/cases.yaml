- id: neva
  order: 1
  title: Identifying every occupant without stopping the car
  subtitle: NEC National Security Systems · U.S. Customs and Border Protection
  status: Deal won · pilot rollout
  open: true
  diagram:
    steps:
      - { label: Vehicle sensor }
      - { label: Multi-camera capture, mine: true }
      - { label: Face detection }
      - { label: Group by occupant }
      - { label: Best image per occupant }
      - { label: Biometric API, mine: true }
      - { label: 1:N watchlist match, mine: true }
      - { label: Access or alert }
    note: NEVA pipeline. I ran the field tests on capture and validated the API and matching workflow.
  situation: >-
    CBP wanted to identify everyone in a moving vehicle at secured entry points. NEC's NEVA system triggers
    several high-resolution cameras as a car passes and sends the best face image of each occupant to a
    biometric matcher.
  role: >-
    Hands-on for about nine months of the pilot: test-data collection and cleaning, configuring test
    environments, validating the biometric API and matching workflow, and running repeated field tests.
  approach: >-
    The controlled demo worked; the field didn't. Night lighting, rain, tinted windows, camera angles and moving
    vehicles all hurt capture. In one test round I coordinated a same-day fix with portable event lighting and
    pop-up canopies over the capture zone. Matching recovered, which proved the environment was the cause, and
    engineering designed the permanent solution.
  outcome: >-
    That evaluation is what the customer bought on. The deal landed and the pilot rollout began; full rollout
    continued after I left.
  facts:
    - { value: ~9 mo, label: hands-on in the pilot }
    - { value: 1 day, label: to prove the field problem was the environment }
  tags: [Biometric API, Multi-camera capture, Field testing, Test-data collection]

- id: ipids
  order: 2
  title: From facial recognition to fiber-optic sensing
  subtitle: NEC National Security Systems · secure government facility
  status: Deployed · post-sales support
  diagram:
    steps:
      - { label: Disturbance at the fence }
      - { label: Sensing fiber }
      - { label: Interrogator }
      - { label: AI classifies & locates }
      - { label: Event stream, mine: true }
      - { label: Operator dashboard, mine: true }
      - { label: Operator responds }
    note: IPIDS event path. I validated events end to end and built the operator dashboard.
  situation: >-
    A federal customer came to NEC asking about facial recognition. Discovery showed the real need was long-term
    intrusion detection around a large, rugged outdoor perimeter, with little capacity for maintenance.
  role: >-
    Gathered requirements with the customer and operators and worked through fit with engineering, who made the
    final recommendation. I explained it to the customer, coordinated through installation, built the operator
    dashboard and stayed on for post-sales support.
  approach: >-
    IPIDS turns buried or fence-mounted fiber into the sensor, with AI that tells climbing, cutting and digging
    apart from rain, wind and animals, and no powered equipment along the fence. I built the dashboard on a
    real-time event platform, similar in role to AWS IoT: each intrusion as it happened, what was detected and
    when, the live camera feed for the alert area, and charts of activity over time. When events stopped arriving
    after an environment migration right before a demo, I traced the path and fixed the network configuration
    with the platform's engineer.
  outcome: >-
    The system was deployed and I supported it after the sale. IPIDS itself won the 2023 ASTORS Platinum award for
    Best Perimeter Protection Solution.
  tags: [Discovery, Fiber-optic sensing, Real-time event dashboard, Live video integration]

- id: smartscan
  order: 3
  title: "SmartScan: validating deployment end to end"
  subtitle: NEC National Security Systems · U.S. Marshals Service & U.S. Secret Service
  status: Secure deployment · post-sale
  diagram:
    steps:
      - { label: Biometric capture }
      - { label: SmartScan workflow, mine: true }
      - { label: Middleware & Insights Archive }
      - { label: Database state, mine: true }
      - { label: Administrator & user handoff, mine: true }
    note: >-
      I checked the complete workflow through the expected database records, then prepared the guides for the
      people who would operate the system.
  situation: >-
    SmartScan deployments in secure federal environments required more than a successful startup. The capture
    workflow had to behave as expected, the resulting records had to persist correctly, and administrators and
    end users needed clear guidance for the handoff.
  role: >-
    Supported installation and configuration for the U.S. Marshals Service and U.S. Secret Service. I validated
    the full user workflow, used SQL to confirm expected records and state changes, troubleshot issues, and wrote
    administrator and end-user guides.
  approach: >-
    I separated the presentation layer, application workflow, and database state while troubleshooting. That let
    me distinguish a display issue from a workflow failure or a record that had not changed as expected, then
    verify the fix end to end before handing the system to its operators.
  outcome: >-
    The workflow was validated through its expected database state, and the handoff included administrator and
    end-user guides. The work reinforced that commitments made in a sale have to hold up during secure deployment
    and for the people operating the system afterward.
  tags: [Secure deployment, SQL validation, Biometric systems, Troubleshooting, Customer handoff]

