- id: neva
  order: 1
  title: Identifying every occupant without stopping the car
  subtitle: NEC National Security Systems · Department of Homeland Security
  status: Deal won · pilot rollout
  open: true
  diagram:
    steps:
      - { label: Vehicle sensor }
      - { label: Multi-camera capture, mine: true }
      - { label: Face detection }
      - { label: Group by occupant }
      - { label: Best image per occupant }
      - { label: Biometric API, mine: true }
      - { label: 1:N watchlist match, mine: true }
      - { label: Access or alert }
    note: NEVA pipeline. I ran the field tests on capture and validated the API and matching workflow.
  situation: >-
    A DHS agency wanted to identify everyone in a moving vehicle at secured entry points. NEC's NEVA system
    triggers several high-resolution cameras as a car passes and sends the best face image of each occupant to a
    biometric matcher.
  role: >-
    Hands-on for about nine months of the pilot: collected and cleaned test data, configured test environments,
    validated the biometric API and matching workflow, and ran repeated field tests with the customer.
  approach: >-
    The controlled demo worked; the field didn't. Night lighting, rain, tinted windows, camera angles and moving
    vehicles all degraded capture, and the pilot stalled. In one test round I coordinated a same-day fix with
    portable event lighting and pop-up canopies over the capture zone. Matching recovered, which proved the
    environment was the cause, and engineering designed the permanent solution from that result.
  outcome: >-
    The field result unblocked the deal: it landed and pilot rollout began. Full rollout continued after I left.
  facts:
    - { value: ~9 mo, label: hands-on in the pilot }
    - { value: 1 day, label: to prove the field problem was the environment }
  tags: [Biometric API, Multi-camera capture, Field testing, Test-data collection]

- id: ipids
  order: 2
  title: From facial recognition to fiber-optic sensing
  subtitle: NEC National Security Systems · secure government facility
  status: Deployed · post-sales support
  diagram:
    steps:
      - { label: Disturbance at the fence }
      - { label: Sensing fiber }
      - { label: Interrogator }
      - { label: AI classifies & locates }
      - { label: Event stream, mine: true }
      - { label: Operator dashboard, mine: true }
      - { label: Operator responds }
    note: IPIDS event path. I validated events end to end and built the operator dashboard.
  situation: >-
    A federal customer came to NEC asking about facial recognition. Discovery showed the real need was long-term
    intrusion detection around a large, rugged outdoor perimeter, with little capacity for maintenance.
  role: >-
    Led discovery with the customer and operators, worked through fit with engineering, who made the final product
    recommendation, and walked the customer through it. Coordinated through installation, built the operator
    dashboard and stayed on for post-sales support.
  approach: >-
    IPIDS turns buried or fence-mounted fiber into the sensor, with AI that tells climbing, cutting and digging
    apart from rain, wind and animals, and no powered equipment along the fence. I built the dashboard on a
    real-time event platform, similar in role to AWS IoT: each intrusion as it happened, what was detected and
    when, the live camera feed for the alert area, and charts of activity over time. I also led the live demo at
    NEC's Identity Week booth. When events stopped arriving the night before, I worked remotely with NEC's
    engineer in Japan and the platform vendor to trace the event path, fix the network and permissions setup, and
    reconfigure for the booth machine, with colleagues on site triggering test alerts. The demo ran cleanly for the
    whole conference.
  outcome: >-
    The system was deployed and I supported it after the sale. IPIDS itself won the 2023 ASTORS Platinum award for
    Best Perimeter Protection Solution.
  tags: [Discovery, Fiber-optic sensing, Real-time event dashboard, Live video integration]

- id: smartscan
  order: 3
  title: Making a biometric booking system hold up after the sale
  subtitle: NEC National Security Systems · U.S. Marshals Service, U.S. Secret Service & state and local law enforcement
  status: Migrated · deployed · handed off
  diagram:
    steps:
      - { label: Record-lifecycle test suite, mine: true }
      - { label: Usability fix (engineering) }
      - { label: Database migration, mine: true }
      - { label: Install & update automation, mine: true }
      - { label: Secure-site deployment }
      - { label: Admin & operator guides, mine: true }
    note: >-
      I tested every stage of the record lifecycle, wrote the migration and install scripts, and wrote the guides
      for the people who run the system.
  situation: >-
    A biometric booking and enrollment system used by federal agencies and state and local law enforcement was
    moving to an upgraded platform. Records had to survive the move with their history intact, every step had to
    work for nontechnical operators, and installs had to run inside secure federal networks.
  role: >-
    Owned testing, database migration scripting, install and maintenance automation, and documentation. Supported
    deployments for the U.S. Marshals Service and the Secret Service, and contributed to discovery and demos.
  approach: >-
    I built an operator test suite covering the whole record lifecycle: enroll, enter demographics, capture
    fingerprints and photos on the physical devices or upload documents, confirm each item attached to the right
    person, edit, search and retrieve, review results, and delete. I flagged malformed and duplicate records and
    retested every fix. Working through it as an operator surfaced a menu that expanded over the photo operators
    needed to cross-check. I mocked up a resize, engineering built it, and I verified it. For the upgrade, I wrote
    migration scripts that carried transaction history forward, then checked the results with diffs, format checks
    and required-field audits before sign-off.
  outcome: >-
    The migration succeeded with history intact, and the system kept running on the upgraded platform. Installs
    and updates became repeatable scripts rather than manual steps, and developers and operators each got a guide
    written for them.
  facts:
    - { value: "8", label: record-lifecycle stages under test }
    - { value: "124", label: field offices in the planned upgrade }
  tags: [Record lifecycle testing, Database migration, PowerShell & Bash, SQL, Secure deployment, Technical writing]

